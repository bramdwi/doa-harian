<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Doa Harian — Mukhtashar Al-Hizbul A'zham & Sholawat 40</title>
    <meta name="description" content="Kumpulan doa harian 7 Hizib Mukhtashar Al-Hizbul A'zham & 40 Hadits Shalawat & Salam">

    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#FAF6EC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Doa Harian">
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa/icons/favicon.png">
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png">

    <!-- Google Fonts (Online Fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="pwa/app.css">
</head>

<body>

    <!-- TOP APP BAR -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-left">
                <button class="icon-btn hamburger-btn" id="open-menu-btn" title="Pilih Hari / Bab (Menu)">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="brand-wrapper">
                    <img src="pwa/icons/icon-512.png" alt="Logo Doa Harian" class="brand-icon">
                    <div class="brand-titles">
                        <h1>Doa Harian</h1>
                        <p>Al-Hizbul A'zham & Sholawat</p>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="open-bookmarks-btn" title="Daftar Bookmark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="badge-count" id="bookmark-count" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN READING CONTAINER -->
    <main class="main-content" id="content-container">
        <!-- Injected by app.js -->
    </main>

    <!-- CHAPTER NAVIGATION DRAWER (HAMBURGER MENU) -->
    <div class="drawer-backdrop" id="menu-drawer-backdrop">
        <aside class="nav-drawer" id="nav-drawer">
            <div class="drawer-header">
                <div class="drawer-brand">
                    <img src="pwa/icons/icon-512.png" alt="Logo" class="drawer-logo">
                    <div>
                        <div class="drawer-title">Menu & Pengaturan</div>
                        <div class="drawer-subtitle">7 Hizib Harian & 40 Shalawat</div>
                    </div>
                </div>
                <button class="icon-btn" id="close-menu-btn" title="Tutup Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="drawer-body">
                <!-- READING PREFERENCES / DISPLAY SETTINGS -->
                <div class="drawer-section">
                    <div class="drawer-section-label">Pengaturan Tampilan</div>
                    <div class="drawer-settings-card">
                        <!-- Font Zoom Controller -->
                        <div class="drawer-setting-row">
                            <span class="setting-title">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="4 7 4 4 20 4 20 7"></polyline>
                                    <line x1="9" y1="20" x2="15" y2="20"></line>
                                    <line x1="12" y1="4" x2="12" y2="20"></line>
                                </svg>
                                Ukuran Font
                            </span>
                            <div class="control-group">
                                <button class="zoom-btn" id="zoom-out-btn" title="Perkecil Font">A-</button>
                                <span class="zoom-label" id="zoom-label">100%</span>
                                <button class="zoom-btn" id="zoom-in-btn" title="Perbesar Font">A+</button>
                            </div>
                        </div>

                        <!-- Latin & Translation Toggles -->
                        <div class="drawer-setting-row toggles-row">
                            <button class="toggle-btn active" id="toggle-latin-btn" title="Aktifkan / Sembunyikan Bacaan Latin">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="4 7 4 4 20 4 20 7"></polyline>
                                    <line x1="9" y1="20" x2="15" y2="20"></line>
                                    <line x1="12" y1="4" x2="12" y2="20"></line>
                                </svg>
                                <span>Latin: ON</span>
                            </button>
                            <button class="toggle-btn active" id="toggle-arti-btn" title="Aktifkan / Sembunyikan Terjemahan">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <span>Arti: ON</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- CHAPTER NAVIGATION -->
                <div class="drawer-section">
                    <div class="drawer-section-label">Pilih Hari / Bab</div>
                    <div class="drawer-chapters-list" id="menu-chapters-list">
                        <!-- Injected dynamically by app.js -->
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- BOOKMARK MODAL / DRAWER -->
    <div class="modal-backdrop" id="bookmark-modal">
        <div class="modal-drawer">
            <div class="modal-header">
                <div class="modal-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Doa Tersimpan (Bookmark)</span>
                </div>
                <button class="icon-btn" id="close-bookmarks-btn" title="Tutup">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="bookmark-list">
                <!-- Injected by app.js -->
            </div>
        </div>
    </div>

    <!-- FLOATING TOAST NOTIFICATION -->
    <div class="toast-container" id="toast"></div>

    <!-- DATA & LOGIC SCRIPTS -->
    <script src="pwa/data.js"></script>
    <script src="pwa/app.js"></script>
</body>

</html>
